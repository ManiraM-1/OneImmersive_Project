server.port=${PORT:8080}

# Shap-E (open-source text-to-3D model) hosted on a free Hugging Face Space
hf.space-url=https://hysts-shap-e.hf.space
hf.api-name=text-to-3d
hf.token=${HF_TOKEN:}
