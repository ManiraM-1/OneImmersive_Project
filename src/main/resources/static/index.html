<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Text to 3D</title>
  <style>
    :root { --bg:#0f1115; --panel:#181b22; --text:#e8eaf0; --muted:#8a90a0; --accent:#6c8cff; --err:#ff6b6b; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); }
    main { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    p.sub { margin: 0 0 20px; color: var(--muted); }
    form { display:flex; gap:8px; flex-wrap:wrap; }
    input { flex:1; min-width:220px; padding:12px 14px; border-radius:10px; border:1px solid #2a2f3a; background:var(--panel); color:var(--text); font-size:1rem; }
    button, a.btn { padding:12px 18px; border-radius:10px; border:0; background:var(--accent); color:#fff; font-size:1rem; cursor:pointer; text-decoration:none; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    a.btn.hidden { display:none; }
    #status { margin:14px 0; min-height:1.4em; color:var(--muted); }
    #status.error { color: var(--err); }
    .bar { height:6px; background:#2a2f3a; border-radius:3px; overflow:hidden; margin-top:6px; }
    .bar > div { height:100%; width:0; background:var(--accent); transition:width .4s; }
    #viewer { width:100%; height:min(65vh, 560px); background:var(--panel); border-radius:14px; position:relative; overflow:hidden; }
    #empty { position:absolute; inset:0; display:grid; place-items:center; color:var(--muted); pointer-events:none; }
    .actions { display:flex; justify-content:space-between; align-items:center; margin-top:12px; color:var(--muted); font-size:.9rem; gap:8px; flex-wrap:wrap; }
  </style>
  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body>
<main>
  <h1>Text to 3D</h1>
  <p class="sub">Describe an object and get a 3D model you can rotate, zoom and download.</p>

  <form id="form">
    <input id="prompt" maxlength="500" placeholder="e.g. a wooden treasure chest with gold trim" required />
    <button id="go" type="submit">Generate</button>
  </form>

  <div id="status"></div>
  <div class="bar"><div id="progress"></div></div>

  <div id="viewer" style="margin-top:16px"><div id="empty">Your model will appear here</div></div>

  <div class="actions">
    <span>Drag to rotate · scroll / pinch to zoom · right-drag to pan</span>
    <a id="download" class="btn hidden" href="#">Download .glb</a>
  </div>
</main>

<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  // ---------- Three.js scene ----------
  const container = document.getElementById('viewer');
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  container.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2.0));
  const sun = new THREE.DirectionalLight(0xffffff, 2.0);
  sun.position.set(3, 5, 4);
  scene.add(sun);

  const controls = new OrbitControls(camera, renderer.domElement); // rotate + zoom
  controls.enableDamping = true;
  camera.position.set(0, 1, 3);

  function resize() {
    const w = container.clientWidth, h = container.clientHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();
  renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });

  let current = null;
  function showModel(url) {
    return new Promise((resolve, reject) => {
      new GLTFLoader().load(url, gltf => {
        if (current) scene.remove(current);
        current = gltf.scene;
        // center the model and fit the camera to it
        const box = new THREE.Box3().setFromObject(current);
        const size = box.getSize(new THREE.Vector3()).length();
        const center = box.getCenter(new THREE.Vector3());
        current.position.sub(center);
        scene.add(current);
        camera.position.set(0, size * 0.3, size * 1.2);
        camera.near = size / 100; camera.far = size * 100;
        camera.updateProjectionMatrix();
        controls.target.set(0, 0, 0);
        controls.update();
        document.getElementById('empty').style.display = 'none';
        resolve();
      }, undefined, reject);
    });
  }

  // ---------- UI + API ----------
  const form = document.getElementById('form');
  const btn = document.getElementById('go');
  const statusEl = document.getElementById('status');
  const bar = document.getElementById('progress');
  const dl = document.getElementById('download');

  function setStatus(text, isError = false) {
    statusEl.textContent = text;
    statusEl.className = isError ? 'error' : '';
  }

  async function api(path, options) {
    const res = await fetch(path, options);
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || `Request failed (${res.status})`);
    return body;
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const prompt = document.getElementById('prompt').value.trim();
    if (!prompt) return;

    btn.disabled = true;
    dl.classList.add('hidden');
    bar.style.width = '0';
    setStatus('Submitting prompt…');

    try {
      const { taskId } = await api('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt })
      });

      // poll until done (generation usually takes under a minute or two)
      const started = Date.now();
      while (true) {
        const s = await api(`/api/status/${taskId}`);
        const secs = Math.round((Date.now() - started) / 1000);
        bar.style.width = `${Math.min(95, secs * 1.5)}%`; // estimated: typical run is ~30-60s
        setStatus(`Generating… ${secs}s (usually 30-60s)`);
        if (s.ready) break;
        if (s.failed) throw new Error(s.error || 'Generation failed. Please try again.');
        if (Date.now() - started > 5 * 60 * 1000) throw new Error('Timed out after 5 minutes.');
        await new Promise(r => setTimeout(r, 3000));
      }

      setStatus('Loading model…');
      await showModel(`/api/model/${taskId}`);
      dl.href = `/api/model/${taskId}?download=true`;
      dl.classList.remove('hidden');
      bar.style.width = '100%';
      setStatus('Done.');
    } catch (err) {
      setStatus(err.message || 'Something went wrong', true);
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
